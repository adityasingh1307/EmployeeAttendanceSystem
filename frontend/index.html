<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employee Attendance System</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffc72c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23101b2d' stroke-width='3'/%3E%3Cpath d='M16 11v5l3 2' fill='none' stroke='%23101b2d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="auth-shell">

        <!-- CLOCK PANEL -->

        <aside class="auth-aside">

            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M16 9v7l4 3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <div class="clock-block">

                <div class="clock" id="liveClock" aria-hidden="true">--:--</div>

                <p class="clock-date" id="liveDate"></p>

            </div>

        </aside>


        <!-- LOGIN -->

        <main class="auth-main">

            <div class="login-box">

                <h1>
                    Employee Attendance
                </h1>

                <p class="subtitle">
                    Attendance Management System
                </p>


                <!-- ROLE SELECTION -->

                <div class="role-selection">

                    <button
                        type="button"
                        id="employeeRoleBtn"
                        class="role-btn active"
                        onclick="showEmployeeLogin()"
                    >
                        Employee
                    </button>


                    <button
                        type="button"
                        id="adminRoleBtn"
                        class="role-btn"
                        onclick="showAdminLogin()"
                    >
                        Admin
                    </button>

                </div>



                <!-- =========================
                     EMPLOYEE LOGIN
                     ========================= -->

                <form id="loginForm">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Login as Employee
                    </button>

                </form>



                <!-- =========================
                     ADMIN LOGIN
                     ========================= -->

                <form
                    id="adminLoginForm"
                    style="display: none;"
                >

                    <label for="adminUsername">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                    >


                    <label for="adminPassword">
                        Admin Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                    >


                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Login as Admin
                    </button>

                </form>


                <p id="message"></p>

            </div>

        </main>

    </div>


    <script src="clock.js"></script>
    <script src="script.js"></script>

</body>

</html>
