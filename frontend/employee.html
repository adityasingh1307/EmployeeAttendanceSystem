<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Dashboard</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffc72c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23101b2d' stroke-width='3'/%3E%3Cpath d='M16 11v5l3 2' fill='none' stroke='%23101b2d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="topbar-inner">

            <div class="brand">

                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/>
                    <path d="M16 9v7l4 3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                <h1>Employee Dashboard</h1>

            </div>

            <button type="button" class="btn btn-on-dark" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <main class="dashboard">

        <section class="punch-panel">

            <p id="welcomeMessage" class="welcome-line">
                Welcome!
            </p>

            <div class="clock-block">

                <div class="clock" id="liveClock" aria-hidden="true">--:--</div>

                <p class="clock-date" id="liveDate"></p>

            </div>

            <div class="dashboard-buttons">

                <button type="button" class="punch-btn" onclick="markAttendance()">
                    Mark Attendance
                </button>

            </div>

            <p id="dashboardMessage"></p>

        </section>


        <section id="attendanceSection">

            <div class="section-header">

                <h2>Attendance History</h2>

                <button type="button" class="btn btn-outline" onclick="viewAttendance()">
                    View Attendance
                </button>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="2">
                                Select View Attendance to load your records.
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="clock.js"></script>
    <script src="script.js"></script>

</body>

</html>
